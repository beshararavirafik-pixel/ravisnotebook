<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Ravi's Notebook</title>
<style>
  :root{--teal:#0f4454;--sand:#8a7060;--cream:#f5efe8;--border:rgba(15,68,84,0.12);--danger:#8b2020;--success:#1a5c3a;--bg:#f0ebe3;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--teal);}

  /* LOGIN */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,#f5efe8 0%,#ddd0c8 35%,#a8c4d0 70%,#0f4454 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;}
  .login-card{background:rgba(255,255,255,0.78);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(202,181,167,0.4);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(15,68,84,0.15);}
  .login-cross{text-align:center;font-size:1.6rem;color:#8A5A44;margin-bottom:16px;opacity:0.7;}
  .login-title{font-family:'Cinzel',serif;font-size:0.85rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--teal);text-align:center;margin-bottom:4px;}
  .login-sub{font-family:'Libre Baskerville',serif;font-size:0.78rem;font-style:italic;color:rgba(15,68,84,0.4);text-align:center;margin-bottom:32px;}
  .lf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .lf label{font-size:10px;color:var(--sand);letter-spacing:0.06em;text-transform:uppercase;font-weight:500;}
  .lf input{padding:11px 14px;background:rgba(245,239,232,0.7);border:1px solid rgba(202,181,167,0.4);border-radius:10px;color:var(--teal);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
  .lf input:focus{border-color:var(--teal);}
  .login-btn{width:100%;padding:12px;background:var(--teal);color:var(--cream);border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.88rem;cursor:pointer;margin-top:8px;transition:all 0.2s;letter-spacing:0.02em;}
  .login-btn:hover{background:#0a2e3a;}
  .login-err{display:none;margin-top:10px;padding:9px 14px;background:rgba(139,32,32,0.08);border:1px solid rgba(139,32,32,0.2);border-radius:8px;font-size:12px;color:var(--danger);text-align:center;}

  /* SHELL */
  #shell{display:none;}

  /* TOP BAR */
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--teal);display:flex;align-items:center;padding:0 20px;z-index:200;gap:14px;box-shadow:0 2px 16px rgba(15,68,84,0.2);}
  .topbar-logo{font-family:'Cinzel',serif;font-size:0.68rem;font-weight:600;letter-spacing:0.2em;color:rgba(202,181,167,0.85);text-transform:uppercase;white-space:nowrap;}
  .topbar-div{width:1px;height:20px;background:rgba(255,255,255,0.1);flex-shrink:0;}
  .topbar-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
  .topbar-tabs::-webkit-scrollbar{display:none;}
  .ptab{padding:6px 14px;border-radius:100px;font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all 0.15s;}
  .ptab:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.07);}
  .ptab.active{background:rgba(255,255,255,0.14);color:#fff;font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .tbtn{padding:6px 14px;border-radius:100px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.2s;border:none;white-space:nowrap;}
  .tbtn-pub{background:#cab5a7;color:var(--teal);font-weight:500;}
  .tbtn-pub:hover{background:#ddd0c0;}
  .tbtn-ghost{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.12);}
  .tbtn-ghost:hover{background:rgba(255,255,255,0.14);color:#fff;}

  /* SIDEBAR */
  .sidebar{position:fixed;top:52px;left:0;bottom:0;width:256px;background:#fff;border-right:1px solid var(--border);z-index:100;overflow-y:auto;padding:16px 0;}
  .sb-section{padding:12px 18px 6px;font-size:10px;color:rgba(15,68,84,0.32);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
  .sb-btn{display:flex;align-items:center;gap:9px;padding:9px 18px;border:none;background:none;color:rgba(15,68,84,0.6);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;width:100%;text-align:left;transition:all 0.15s;}
  .sb-btn:hover{background:rgba(15,68,84,0.04);color:var(--teal);}
  .sb-btn.active{background:rgba(15,68,84,0.07);color:var(--teal);font-weight:500;border-right:2px solid var(--teal);}
  .sb-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
  .sb-div{height:1px;background:var(--border);margin:10px 0;}
  .sb-hint{padding:10px 18px;font-size:11px;color:rgba(15,68,84,0.35);line-height:1.6;}

  /* MAIN */
  .main{margin-left:256px;margin-top:52px;padding:28px 32px;min-height:calc(100vh - 52px);}
  .canvas{max-width:880px;margin:0 auto;}

  /* PANEL HEADER */
  .ph{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
  .ph-left h1{font-family:'Libre Baskerville',serif;font-size:1.55rem;font-weight:400;color:var(--teal);margin-bottom:3px;}
  .ph-left p{font-size:12px;color:rgba(15,68,84,0.4);font-weight:300;}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;}
  .stat-n{font-family:'Libre Baskerville',serif;font-size:2rem;font-weight:400;color:var(--teal);line-height:1;}
  .stat-l{font-size:10px;color:rgba(15,68,84,0.38);margin-top:5px;text-transform:uppercase;letter-spacing:0.06em;}

  /* BLOCK LIST */
  .blocks{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}

  /* BLOCK */
  .block{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:box-shadow 0.2s;}
  .block:hover{box-shadow:0 4px 18px rgba(15,68,84,0.08);}
  .block-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
  .block.open .block-hd{border-bottom:1px solid var(--border);}
  .block-icon-wrap{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .bi-note{background:rgba(15,68,84,0.07);}
  .bi-text{background:rgba(138,112,96,0.1);}
  .bi-audio{background:rgba(139,90,50,0.08);}
  .bi-video{background:rgba(220,60,60,0.07);}
  .bi-youtube{background:rgba(220,60,60,0.1);}
  .bi-soundcloud{background:rgba(255,90,0,0.08);}
  .bi-image{background:rgba(60,130,180,0.08);}
  .bi-link{background:rgba(15,68,84,0.06);}
  .bi-pdf{background:rgba(139,32,32,0.07);}
  .bi-hymn{background:rgba(15,68,84,0.07);}
  .block-info{flex:1;min-width:0;}
  .block-type-label{font-size:10px;color:rgba(15,68,84,0.35);letter-spacing:0.05em;text-transform:uppercase;font-weight:500;margin-bottom:2px;}
  .block-preview{font-family:'Libre Baskerville',serif;font-size:0.92rem;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .block-acts{display:flex;gap:5px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
  .block:hover .block-acts{opacity:1;}
  .bact{padding:4px 10px;border-radius:100px;border:1px solid var(--border);background:none;font-size:11px;color:rgba(15,68,84,0.5);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
  .bact:hover{background:rgba(15,68,84,0.05);color:var(--teal);}
  .bact-del{color:var(--danger);border-color:rgba(139,32,32,0.15);}
  .bact-del:hover{background:rgba(139,32,32,0.05);}
  .block-chevron{color:rgba(15,68,84,0.22);font-size:10px;margin-left:4px;flex-shrink:0;transition:transform 0.2s;}
  .block.open .block-chevron{transform:rotate(180deg);}
  .block-body{display:none;padding:20px;}
  .block.open .block-body{display:block;}

  /* BLOCK FORM */
  .bf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .bf label{font-size:10px;color:var(--sand);letter-spacing:0.05em;text-transform:uppercase;font-weight:500;}
  .bf input,.bf select,.bf textarea{padding:9px 13px;background:rgba(245,239,232,0.5);border:1px solid rgba(202,181,167,0.35);border-radius:9px;color:var(--teal);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;appearance:none;width:100%;}
  .bf textarea{resize:vertical;min-height:90px;line-height:1.6;}
  .bf input:focus,.bf select:focus,.bf textarea:focus{border-color:var(--teal);}
  .bf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bf-hint{font-size:11px;color:rgba(15,68,84,0.38);margin-top:4px;line-height:1.5;}
  .bf-preview{margin-top:10px;border-radius:10px;overflow:hidden;background:rgba(245,239,232,0.4);border:1px solid rgba(202,181,167,0.2);}
  .bf-preview img{width:100%;max-height:180px;object-fit:cover;display:block;}
  .bf-preview audio,.bf-preview iframe{width:100%;display:block;}

  /* ADD BLOCK AREA */
  .add-area{border:2px dashed rgba(202,181,167,0.4);border-radius:14px;padding:20px;margin-bottom:8px;}
  .add-area-label{font-size:11px;color:rgba(15,68,84,0.32);letter-spacing:0.06em;text-transform:uppercase;text-align:center;margin-bottom:14px;}
  .block-types-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .bt-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:#fff;border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:11px;color:rgba(15,68,84,0.6);font-family:'DM Sans',sans-serif;transition:all 0.18s;text-align:center;}
  .bt-card:hover{background:rgba(15,68,84,0.04);border-color:rgba(15,68,84,0.2);color:var(--teal);transform:translateY(-1px);}
  .bt-card-icon{font-size:22px;}

  /* SAVE BTN */
  .save-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;border-radius:100px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all 0.2s;font-weight:400;}
  .btn-solid{background:var(--teal);color:#fff;}
  .btn-solid:hover{background:#0a2e3a;}
  .btn-ghost{background:none;border:1px solid var(--border);color:rgba(15,68,84,0.6);}
  .btn-ghost:hover{background:rgba(15,68,84,0.04);color:var(--teal);}
  .btn-red{background:none;border:1px solid rgba(139,32,32,0.15);color:var(--danger);}
  .btn-red:hover{background:rgba(139,32,32,0.05);}

  /* Q&A */
  .qa-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:10px;}
  .qa-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .qbadge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:500;letter-spacing:0.02em;}
  .qb-topic{background:rgba(138,112,96,0.1);color:var(--sand);}
  .qb-new{background:rgba(15,68,84,0.08);color:var(--teal);}
  .qb-done{background:rgba(26,92,58,0.08);color:var(--success);}
  .qa-date{font-size:11px;color:rgba(15,68,84,0.28);margin-left:auto;}
  .qa-q{font-family:'Libre Baskerville',serif;font-size:1rem;color:var(--teal);margin-bottom:12px;line-height:1.5;}
  .qa-a-display{background:rgba(245,239,232,0.6);border:1px solid rgba(202,181,167,0.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#2d4a5a;line-height:1.7;margin-bottom:10px;}
  .qa-input{width:100%;padding:10px 13px;background:rgba(245,239,232,0.5);border:1px solid rgba(202,181,167,0.35);border-radius:10px;color:var(--teal);font-family:'DM Sans',sans-serif;font-size:13px;min-height:80px;outline:none;resize:vertical;line-height:1.6;margin-bottom:10px;}
  .qa-input:focus{border-color:var(--teal);}
  .qa-acts{display:flex;gap:8px;}

  /* SETTINGS */
  .set-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:14px;max-width:440px;}
  .set-title{font-family:'Libre Baskerville',serif;font-size:1rem;font-weight:400;color:var(--teal);margin-bottom:18px;}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--teal);color:#fff;padding:11px 22px;border-radius:100px;font-size:13px;z-index:999;opacity:0;transition:all 0.3s ease;white-space:nowrap;box-shadow:0 8px 24px rgba(15,68,84,0.25);}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

  /* EMPTY */
  .empty{text-align:center;padding:40px 24px;}
  .empty-icon{font-size:2.5rem;opacity:0.18;margin-bottom:10px;}
  .empty-text{font-family:'Libre Baskerville',serif;font-style:italic;color:rgba(15,68,84,0.32);font-size:0.9rem;}

  @media(max-width:768px){
    .sidebar{display:none;}
    .main{margin-left:0;padding:16px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .block-types-grid{grid-template-columns:repeat(2,1fr);}
    .topbar-tabs{display:none;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-cross">&#9769;</div>
    <div class="login-title">Ravi's Notebook</div>
    <div class="login-sub">Admin access only</div>
    <div class="lf"><label>Username</label><input type="text" id="lu" placeholder="admin" autocomplete="username"/></div>
    <div class="lf"><label>Password</label><input type="password" id="lp" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="lerr">Incorrect username or password.</div>
  </div>
</div>

<!-- SHELL -->
<div id="shell">
  <div class="topbar">
    <span class="topbar-logo">&#9769; Admin</span>
    <div class="topbar-div"></div>
    <div class="topbar-tabs" id="topbarTabs">
      <button class="ptab active" onclick="goPage('dashboard',this)">Dashboard</button>
      <button class="ptab" onclick="goPage('notes',this)">Notes</button>
      <button class="ptab" onclick="goPage('pdfs',this)">PDFs</button>
      <button class="ptab" onclick="goPage('hymns',this)">Hymns</button>
      <button class="ptab" onclick="goPage('qa',this)">Q&amp;A</button>
      <button class="ptab" onclick="goPage('settings',this)">Settings</button>
    </div>
    <div class="topbar-right">
      <button class="tbtn tbtn-ghost" onclick="window.open('index.html','_blank')">&#8592; View site</button>
      <button class="tbtn tbtn-ghost" style="font-size:11px" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <aside class="sidebar" id="sb"></aside>
  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──
const K={notes:'rn_notes',pdfs:'rn_pdfs',hymns:'rn_hymns',qa:'rn_qa',pass:'rn_pass',auth:'rn_auth'};
const DEF_PASS='coptic2025';
function getPass(){return localStorage.getItem(K.pass)||DEF_PASS;}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function today(){return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}

// ── AUTH ──
function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  if(u==='admin'&&p===getPass()){
    localStorage.setItem(K.auth,'1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('shell').style.display='block';
    goPage('dashboard',document.querySelector('.ptab'));
  } else {
    document.getElementById('lerr').style.display='block';
  }
}
function doLogout(){localStorage.removeItem(K.auth);location.reload();}
if(localStorage.getItem(K.auth)==='1'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('shell').style.display='block';
}

// ── TOAST ──
function toast(msg,dur=2600){
  const t=document.getElementById('toast');
  t.innerHTML=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}

// ── NAV ──
let curPage='dashboard';
function goPage(page,tab){
  curPage=page;
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  if(tab)tab.classList.add('active');
  render(page);
}

// ── BLOCK TYPE DEFINITIONS ──
// Each type has: id, label, icon, iconClass, fields[]
// field types: text, textarea, select, url, file-hint
const BLOCK_DEFS = [
  {id:'text',     label:'Text',        icon:'&#9998;',    cls:'bi-text',
   fields:[
     {id:'heading', label:'Heading (optional)', type:'text', ph:'Section heading'},
     {id:'body',    label:'Body Text',           type:'textarea', ph:'Write your content here...'},
   ]},
  {id:'note',     label:'Note / Lesson', icon:'&#128221;', cls:'bi-note',
   fields:[
     {id:'title',   label:'Title',    type:'text', ph:'e.g. Chastity and the Saints'},
     {id:'cat',     label:'Category', type:'select', opts:['Sunday School','Theology','Patristics','Hagiography','Liturgy','Diaconate','Other']},
     {id:'body',    label:'Content',  type:'textarea', ph:'Write the lesson content here...'},
   ]},
  {id:'audio',    label:'Audio',       icon:'&#127911;',  cls:'bi-audio',
   fields:[
     {id:'title',   label:'Title',                  type:'text', ph:'e.g. Pi-Epnevma Ethowab'},
     {id:'src',     label:'Audio File Path or URL', type:'url',  ph:'hymns/file.mp3 or https://...', hint:'Upload your .mp3 to the /hymns/ folder on GitHub and paste the path here.'},
   ]},
  {id:'youtube',  label:'YouTube',     icon:'&#9654;&#65039;', cls:'bi-youtube',
   fields:[
     {id:'title',   label:'Title (optional)',   type:'text', ph:'Video title'},
     {id:'url',     label:'YouTube URL or ID',  type:'url',  ph:'https://www.youtube.com/watch?v=... or just the ID', hint:'Paste the full YouTube URL or just the video ID (e.g. dQw4w9WgXcQ).'},
   ]},
  {id:'soundcloud',label:'SoundCloud', icon:'&#9729;',    cls:'bi-soundcloud',
   fields:[
     {id:'title',   label:'Title (optional)',    type:'text', ph:'Track title'},
     {id:'url',     label:'SoundCloud Track URL',type:'url',  ph:'https://soundcloud.com/artist/track', hint:'Paste the full SoundCloud track URL.'},
   ]},
  {id:'video',    label:'Video File',  icon:'&#127916;',  cls:'bi-video',
   fields:[
     {id:'title',   label:'Title (optional)',   type:'text', ph:'Video title'},
     {id:'src',     label:'Video File Path or URL', type:'url', ph:'videos/file.mp4 or https://...', hint:'Upload your video to GitHub or link directly.'},
   ]},
  {id:'image',    label:'Image',       icon:'&#128247;',  cls:'bi-image',
   fields:[
     {id:'alt',     label:'Caption / Alt text', type:'text', ph:'Describe the image'},
     {id:'src',     label:'Image Path or URL',  type:'url',  ph:'images/photo.jpg or https://...', hint:'Upload images to an /images/ folder on GitHub, or paste any direct image URL.'},
   ]},
  {id:'link',     label:'Link',        icon:'&#128279;',  cls:'bi-link',
   fields:[
     {id:'label',   label:'Link Text', type:'text', ph:'e.g. View the Agpeya'},
     {id:'url',     label:'URL',        type:'url',  ph:'https://...'},
     {id:'desc',    label:'Description (optional)', type:'text', ph:'Brief note about this link'},
   ]},
  {id:'pdf',      label:'PDF',         icon:'&#128196;',  cls:'bi-pdf',
   fields:[
     {id:'name',    label:'Document Name', type:'text', ph:'e.g. The Agpeya — Book of Hours'},
     {id:'desc',    label:'Description',   type:'text', ph:'What is this document?'},
     {id:'src',     label:'PDF Path or URL', type:'url', ph:'pdfs/file.pdf or https://...', hint:'Upload PDFs to a /pdfs/ folder on GitHub.'},
   ]},
  {id:'hymn',     label:'Hymn',        icon:'&#127925;',  cls:'bi-hymn',
   fields:[
     {id:'name',    label:'Hymn Name',   type:'text', ph:'e.g. Pi-Epnevma Ethowab'},
     {id:'coptic',  label:'Coptic Name (optional)', type:'text', ph:'e.g. Ⲡⲓⲡⲛⲉⲩⲙⲁ'},
     {id:'season',  label:'Season', type:'select', opts:['General','Kiahk','Nativity','Epiphany','Great Lent','Holy Week','Resurrection','Pentecost','Apostles Fast','Saint Mary','Other']},
     {id:'src',     label:'Audio File Path or URL', type:'url', ph:'hymns/file.mp3', hint:'Upload to /hymns/ folder on GitHub.'},
     {id:'tag',     label:'Tag (optional)', type:'text', ph:'e.g. Coptic, Greek'},
   ]},
];

const DEF_BY_ID = Object.fromEntries(BLOCK_DEFS.map(d=>[d.id,d]));

// Which block types show in which page
const PAGE_BLOCKS = {
  notes:   ['text','note','image','link','youtube'],
  pdfs:    ['pdf','link','text'],
  hymns:   ['hymn','audio','soundcloud','youtube','link','text'],
};

// ── RENDER ROUTER ──
function render(page){
  const sb=document.getElementById('sb');
  const main=document.getElementById('main');
  if(page==='dashboard')  renderDashboard(sb,main);
  else if(page==='qa')    renderQA(sb,main);
  else if(page==='settings') renderSettings(sb,main);
  else                    renderEditor(page,sb,main);
}

// ── DASHBOARD ──
function renderDashboard(sb,main){
  const notes=load(K.notes),pdfs=load(K.pdfs),hymns=load(K.hymns),qa=load(K.qa);
  const pending=qa.filter(q=>!q.answer).length;
  sb.innerHTML=`
    <div class="sb-section">Quick add</div>
    <button class="sb-btn" onclick="goPage('notes',getTabs()[1])"><span class="sb-icon">&#128196;</span>Add to Notes</button>
    <button class="sb-btn" onclick="goPage('pdfs',getTabs()[2])"><span class="sb-icon">&#128451;</span>Add PDF</button>
    <button class="sb-btn" onclick="goPage('hymns',getTabs()[3])"><span class="sb-icon">&#127925;</span>Add Hymn</button>
    <div class="sb-div"></div>
    <button class="sb-btn" onclick="goPage('qa',getTabs()[4])"><span class="sb-icon">&#10067;</span>Review Q&amp;A ${pending?`<span style="background:var(--danger);color:#fff;border-radius:100px;padding:1px 7px;font-size:10px;margin-left:4px">${pending}</span>`:''}</button>`;

  main.innerHTML=`<div class="canvas">
    <div class="ph"><div class="ph-left"><h1>Dashboard</h1><p>Welcome back. Site overview below.</p></div></div>
    <div class="stats">
      <div class="stat"><div class="stat-n">${notes.length}</div><div class="stat-l">Notes</div></div>
      <div class="stat"><div class="stat-n">${pdfs.length}</div><div class="stat-l">PDFs</div></div>
      <div class="stat"><div class="stat-n">${hymns.length}</div><div class="stat-l">Hymns</div></div>
      <div class="stat"><div class="stat-n" style="${pending?'color:var(--danger)':''}">${pending}</div><div class="stat-l">Pending Q&amp;A</div></div>
    </div>
    ${pending?`<div style="background:#fff;border:1px solid rgba(139,32,32,0.18);border-radius:12px;padding:16px 20px;margin-bottom:16px;cursor:pointer;display:flex;align-items:center;gap:12px" onclick="goPage('qa',getTabs()[4])">
      <span style="font-size:20px">&#9679;</span>
      <div><div style="font-size:13px;font-weight:500;color:var(--danger)">${pending} question${pending>1?'s':''} waiting for an answer</div><div style="font-size:12px;color:rgba(15,68,84,0.4);margin-top:2px">Click to review and publish</div></div>
      <span style="margin-left:auto;color:rgba(15,68,84,0.3)">&#8594;</span></div>`:''}
    ${qa.length?`<div style="background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);font-family:'Libre Baskerville',serif;font-size:0.92rem;color:var(--teal)">Recent Questions</div>
      <table style="width:100%;border-collapse:collapse">${qa.slice(0,5).map(q=>`
        <tr style="border-bottom:1px solid rgba(15,68,84,0.05)">
          <td style="padding:11px 18px;font-size:13px;color:var(--teal);max-width:260px">${q.question.substring(0,65)}${q.question.length>65?'...':''}</td>
          <td style="padding:11px 18px"><span class="qbadge ${q.answer?'qb-done':'qb-new'}">${q.answer?'&#10003; Answered':'Pending'}</span></td>
          <td style="padding:11px 18px;font-size:11px;color:rgba(15,68,84,0.3)">${q.date}</td>
        </tr>`).join('')}</table></div>`
      :`<div class="empty"><div class="empty-icon">&#10067;</div><div class="empty-text">No questions yet</div></div>`}
  </div>`;
}
function getTabs(){return document.querySelectorAll('.ptab');}

// ── BLOCK EDITOR ──
function renderEditor(page,sb,main){
  const typeIds=PAGE_BLOCKS[page]||[];
  const types=typeIds.map(id=>DEF_BY_ID[id]).filter(Boolean);
  const pageLabel={notes:'Notes',pdfs:'PDFs',hymns:'Hymns'}[page]||page;

  sb.innerHTML=`
    <div class="sb-section">Add Block</div>
    ${types.map(t=>`<button class="sb-btn" onclick="addBlock('${page}','${t.id}')"><span class="sb-icon">${t.icon}</span>${t.label}</button>`).join('')}
    <div class="sb-div"></div>
    <div class="sb-hint">Click any block below to expand and edit it. Use the arrows to reorder. Hit Publish when done.</div>`;

  const items=load(K[page]);
  main.innerHTML=`<div class="canvas">
    <div class="ph">
      <div class="ph-left"><h1>${pageLabel}</h1><p>${items.length} block${items.length!==1?'s':''} &mdash; expand to edit, then Publish.</p></div>
      <button class="tbtn tbtn-pub" style="padding:9px 20px;font-size:13px" onclick="publishPage('${page}','${pageLabel}')">&#10003;&nbsp;Publish ${pageLabel}</button>
    </div>
    <div class="blocks" id="bl-${page}"></div>
    <div class="add-area">
      <div class="add-area-label">Add a block</div>
      <div class="block-types-grid">${types.map(t=>`
        <div class="bt-card" onclick="addBlock('${page}','${t.id}')">
          <div class="bt-card-icon">${t.icon}</div>
          <div>${t.label}</div>
        </div>`).join('')}</div>
    </div>
  </div>`;
  renderBlocks(page);
}

function renderBlocks(page){
  const container=document.getElementById('bl-'+page);
  if(!container)return;
  const items=load(K[page]);
  if(!items.length){container.innerHTML=`<div class="empty"><div class="empty-icon">&#9998;</div><div class="empty-text">No blocks yet. Add one above.</div></div>`;return;}
  container.innerHTML=items.map((item,idx)=>{
    const def=DEF_BY_ID[item._type]||DEF_BY_ID['text'];
    const preview=item.title||item.name||item.heading||item.label||item.body||'(empty)';
    const isOpen=item._open?'open':'';
    return`<div class="block ${isOpen}" id="blk-${item.id}">
      <div class="block-hd" onclick="toggleBlock('${page}',${item.id})">
        <div class="block-icon-wrap ${def.cls}">${def.icon}</div>
        <div class="block-info">
          <div class="block-type-label">${def.label}</div>
          <div class="block-preview">${preview.substring(0,60)}</div>
        </div>
        <div class="block-acts">
          ${idx>0?`<button class="bact" onclick="event.stopPropagation();moveBlock('${page}',${item.id},-1)" title="Move up">&#8593;</button>`:''}
          ${idx<items.length-1?`<button class="bact" onclick="event.stopPropagation();moveBlock('${page}',${item.id},1)" title="Move down">&#8595;</button>`:''}
          <button class="bact bact-del" onclick="event.stopPropagation();deleteBlock('${page}',${item.id})">Delete</button>
        </div>
        <span class="block-chevron">&#9660;</span>
      </div>
      <div class="block-body">
        ${buildBlockForm(def,item)}
        ${buildPreview(def,item)}
        <div class="save-row">
          <button class="btn btn-solid" onclick="saveBlock('${page}',${item.id})">&#10003;&nbsp;Save</button>
          <button class="btn btn-ghost" onclick="toggleBlock('${page}',${item.id})">Close</button>
        </div>
      </div>
    </div>`;}).join('');
}

function buildBlockForm(def,item){
  return def.fields.map(f=>{
    const val=(item[f.id]||'').replace(/"/g,'&quot;');
    if(f.type==='select'){
      const opts=(f.opts||[]).map(o=>`<option${o===item[f.id]?' selected':''}>${o}</option>`).join('');
      return`<div class="bf"><label>${f.label}</label><select data-fid="${f.id}">${opts}</select></div>`;
    }
    if(f.type==='textarea'){
      return`<div class="bf"><label>${f.label}</label><textarea data-fid="${f.id}" placeholder="${f.ph||''}">${item[f.id]||''}</textarea></div>`;
    }
    // text / url
    const hint=f.hint?`<div class="bf-hint">${f.hint}</div>`:'';
    return`<div class="bf"><label>${f.label}</label><input type="text" data-fid="${f.id}" value="${val}" placeholder="${f.ph||''}"/>${hint}</div>`;
  }).join('');
}

function buildPreview(def,item){
  // Show a live preview inside the block based on type
  if(def.id==='audio'&&item.src){
    return`<div class="bf-preview"><audio controls style="padding:8px;background:#f5efe8"><source src="${item.src}"/>Your browser does not support audio.</audio></div>`;
  }
  if(def.id==='hymn'&&item.src){
    return`<div class="bf-preview"><audio controls style="padding:8px;background:#f5efe8"><source src="${item.src}"/>Your browser does not support audio.</audio></div>`;
  }
  if(def.id==='youtube'&&item.url){
    const vid=extractYT(item.url);
    if(vid) return`<div class="bf-preview"><iframe height="200" src="https://www.youtube.com/embed/${vid}" frameborder="0" allowfullscreen></iframe></div>`;
  }
  if(def.id==='soundcloud'&&item.url){
    const enc=encodeURIComponent(item.url);
    return`<div class="bf-preview"><iframe height="120" scrolling="no" frameborder="no" src="https://w.soundcloud.com/player/?url=${enc}&color=%230f4454&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe></div>`;
  }
  if(def.id==='video'&&item.src){
    return`<div class="bf-preview"><video controls style="max-height:180px;width:100%"><source src="${item.src}"/>Your browser does not support video.</video></div>`;
  }
  if(def.id==='image'&&item.src){
    return`<div class="bf-preview"><img src="${item.src}" alt="${item.alt||''}"/></div>`;
  }
  return'';
}

function extractYT(url){
  // Extract YouTube video ID from various URL formats
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([A-Za-z0-9_-]{11})/);
  if(m)return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(url.trim()))return url.trim();
  return null;
}

function toggleBlock(page,id){
  const items=load(K[page]);
  const idx=items.findIndex(x=>x.id===id);
  if(idx<0)return;
  items[idx]._open=!items[idx]._open;
  save(K[page],items);
  renderBlocks(page);
}

function addBlock(page,typeId){
  const def=DEF_BY_ID[typeId];if(!def)return;
  const items=load(K[page]);
  const newItem={id:uid(),_type:typeId,_open:true,date:today()};
  // defaults for selects
  def.fields.forEach(f=>{if(f.type==='select'&&f.opts)newItem[f.id]=f.opts[0];});
  items.unshift(newItem);
  save(K[page],items);
  renderBlocks(page);
  toast(`${def.icon} ${def.label} block added`);
  // scroll to top of blocks
  const bl=document.getElementById('bl-'+page);
  if(bl)bl.scrollIntoView({behavior:'smooth',block:'start'});
}

function saveBlock(page,id){
  const items=load(K[page]);
  const idx=items.findIndex(x=>x.id===id);if(idx<0)return;
  // Read fields from DOM
  const blkEl=document.getElementById('blk-'+id);if(!blkEl)return;
  blkEl.querySelectorAll('[data-fid]').forEach(el=>{items[idx][el.dataset.fid]=el.value;});
  items[idx]._open=false;
  save(K[page],items);
  renderBlocks(page);
  toast('&#10003; Saved');
}

function deleteBlock(page,id){
  if(!confirm('Delete this block?'))return;
  let items=load(K[page]);
  items=items.filter(x=>x.id!==id);
  save(K[page],items);
  renderBlocks(page);
  toast('Deleted');
}

function moveBlock(page,id,dir){
  const items=load(K[page]);
  const idx=items.findIndex(x=>x.id===id);
  const swap=idx+dir;
  if(swap<0||swap>=items.length)return;
  [items[idx],items[swap]]=[items[swap],items[idx]];
  save(K[page],items);
  renderBlocks(page);
}

function publishPage(page,label){
  toast(`&#10003;&nbsp;${label} published — changes are live`,3000);
}

// ── Q&A ──
let qf='all';
function renderQA(sb,main){
  sb.innerHTML=`
    <div class="sb-section">Filter</div>
    <button class="sb-btn ${qf==='all'?'active':''}" onclick="setQF('all',this)"><span class="sb-icon">&#9636;</span>All</button>
    <button class="sb-btn ${qf==='pending'?'active':''}" onclick="setQF('pending',this)"><span class="sb-icon">&#9679;</span>Pending</button>
    <button class="sb-btn ${qf==='answered'?'active':''}" onclick="setQF('answered',this)"><span class="sb-icon">&#10003;</span>Answered</button>
    <div class="sb-div"></div>
    <div class="sb-hint">Answers you publish appear immediately on the public Q&amp;A page.</div>`;

  main.innerHTML=`<div class="canvas">
    <div class="ph"><div class="ph-left"><h1>Q&amp;A</h1><p>Review questions and publish answers.</p></div></div>
    <div id="qa-content"></div>
  </div>`;
  renderQABlocks();
}

function setQF(f,btn){
  qf=f;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderQABlocks();
}

function renderQABlocks(){
  const container=document.getElementById('qa-content');if(!container)return;
  let qa=load(K.qa);
  if(qf==='pending')qa=qa.filter(q=>!q.answer);
  if(qf==='answered')qa=qa.filter(q=>q.answer);
  if(!qa.length){
    container.innerHTML=`<div class="empty"><div class="empty-icon">&#10067;</div><div class="empty-text">No ${qf==='all'?'':qf} questions</div></div>`;return;
  }
  container.innerHTML=qa.map(q=>`
    <div class="qa-card">
      <div class="qa-meta">
        <span class="qbadge qb-topic">${q.topic||'General'}</span>
        ${q.answer?'<span class="qbadge qb-done">&#10003; Answered</span>':'<span class="qbadge qb-new">New</span>'}
        <span class="qa-date">${q.date}</span>
      </div>
      <div class="qa-q">${q.question}</div>
      ${q.answer
        ?`<div class="qa-a-display">${q.answer}</div>
           <div class="qa-acts">
             <button class="btn btn-ghost" onclick="editAns(${q.id})">Edit answer</button>
             <button class="btn btn-red" onclick="delQA(${q.id})">Delete</button>
           </div>`
        :`<textarea class="qa-input" id="qans-${q.id}" placeholder="Write your answer here..."></textarea>
          <div class="qa-acts">
            <button class="btn btn-solid" onclick="pubAns(${q.id})">&#10003;&nbsp;Publish Answer</button>
            <button class="btn btn-red" onclick="delQA(${q.id})">Delete</button>
          </div>`}
    </div>`).join('');
}

function pubAns(id){
  const el=document.getElementById('qans-'+id);
  if(!el||!el.value.trim()){toast('Write an answer first');return;}
  const qa=load(K.qa);
  const idx=qa.findIndex(q=>q.id===id);if(idx<0)return;
  qa[idx].answer=el.value.trim();
  save(K.qa,qa);
  renderQABlocks();
  toast('&#10003; Answer published — visible on site now',3000);
}
function editAns(id){
  const qa=load(K.qa);const idx=qa.findIndex(q=>q.id===id);if(idx<0)return;
  const a=prompt('Edit answer:',qa[idx].answer);if(a===null)return;
  qa[idx].answer=a;save(K.qa,qa);renderQABlocks();toast('Answer updated');
}
function delQA(id){
  if(!confirm('Delete this question?'))return;
  let qa=load(K.qa);qa=qa.filter(q=>q.id!==id);save(K.qa,qa);renderQABlocks();toast('Deleted');
}

// ── SETTINGS ──
function renderSettings(sb,main){
  sb.innerHTML=`
    <div class="sb-section">Options</div>
    <button class="sb-btn active"><span class="sb-icon">&#128274;</span>Password</button>
    <button class="sb-btn" onclick="exportData()"><span class="sb-icon">&#8595;</span>Export backup</button>`;

  main.innerHTML=`<div class="canvas">
    <div class="ph"><div class="ph-left"><h1>Settings</h1></div></div>
    <div class="set-card">
      <div class="set-title">&#128274; Change Admin Password</div>
      <div class="lf"><label>Current Password</label><input type="password" id="cp"/></div>
      <div class="lf"><label>New Password</label><input type="password" id="np"/></div>
      <div class="lf"><label>Confirm New Password</label><input type="password" id="cnp"/></div>
      <button class="btn btn-solid" style="margin-top:4px" onclick="changePass()">Update Password</button>
    </div>
    <div class="set-card">
      <div class="set-title">&#8595; Export Data</div>
      <p style="font-size:13px;color:rgba(15,68,84,0.5);margin-bottom:14px;line-height:1.6;font-weight:300">Download all your content — notes, PDFs, hymns, Q&amp;A — as a JSON backup file.</p>
      <button class="btn btn-ghost" onclick="exportData()">Download backup</button>
    </div>
  </div>`;
}
function changePass(){
  const cp=document.getElementById('cp').value;
  const np=document.getElementById('np').value;
  const cnp=document.getElementById('cnp').value;
  if(cp!==getPass()){toast('Current password is incorrect');return;}
  if(np!==cnp){toast('New passwords do not match');return;}
  if(np.length<6){toast('Minimum 6 characters');return;}
  localStorage.setItem(K.pass,np);
  ['cp','np','cnp'].forEach(id=>document.getElementById(id).value='');
  toast('&#10003; Password updated');
}
function exportData(){
  const data={notes:load(K.notes),pdfs:load(K.pdfs),hymns:load(K.hymns),qa:load(K.qa),exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ravis-notebook-backup.json';a.click();
  toast('Backup downloaded');
}

// Auto-init
if(localStorage.getItem(K.auth)==='1'){
  setTimeout(()=>render('dashboard'),10);
}
document.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem(K.auth)==='1') render('dashboard');
});
</script>
